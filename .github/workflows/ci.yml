name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的重复推送取消旧任务，避免排队
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (main)
        run: npx tsc --noEmit -p tsconfig.main.json

      - name: Typecheck (preload)
        run: npx tsc --noEmit -p tsconfig.preload.json

      - name: Typecheck (renderer)
        run: npx tsc --noEmit -p tsconfig.renderer.json

      - name: Test
        run: npm test

      # 只构建 renderer：桌面版的 main/preload 依赖 Electron，
      # 在 CI 上跑没有收益（真正需要验证的是浏览器产物）
      - name: Build renderer
        run: npx vite build
